<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4조 2교대 근무 달력</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --header-text: #0f172a;
            --weekday-bg: transparent;
            --day-bg: transparent;
            --other-month-opacity: 0.25;
            --sub-card-bg: #f8fafc;
            --input-bg: #ffffff;
            --widget-radius: 28px;
            --sun-color: #ef4444;
            --sat-color: #3b82f6;
            --today-box: rgba(37, 99, 235, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --border-color: #27272a;
            --primary: #3b82f6;
            --header-text: #f4f4f5;
            --weekday-bg: transparent;
            --day-bg: transparent;
            --other-month-opacity: 0.2;
            --sub-card-bg: #27272a;
            --input-bg: #18181b;
            --widget-radius: 28px;
            --sun-color: #f87171;
            --sat-color: #60a5fa;
            --today-box: #1d3557;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 12px;
            max-width: 500px;
            margin: 0 auto;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        .title-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--header-text);
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        h1:hover {
            background-color: var(--sub-card-bg);
        }

        .title-input {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 2px 8px;
            background: var(--input-bg);
            width: 100%;
        }

        .theme-toggle-btn {
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            border-color: var(--primary);
        }

        .config-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .header-btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn {
            font-size: 0.82rem;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .worker-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .worker-btn {
            background: var(--sub-card-bg);
            border: 1.5px solid transparent;
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .worker-btn:active {
            cursor: grabbing;
        }

        .worker-btn.active {
            background: var(--card-bg);
            border-color: var(--primary);
            color: var(--primary);
        }

        .worker-btn.dragging {
            opacity: 0.5;
            background: var(--primary);
            color: white;
        }

        .sub-config-panel {
            display: none;
            flex-direction: column;
            gap: 14px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
        }

        .sub-config-panel.show { display: flex; }

        .config-sub-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .name-edit-grid, .shift-custom-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .input-group label {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-group input[type="text"] {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.82rem;
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
        }

        .shift-config-item {
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .shift-config-title {
            font-size: 0.78rem;
            font-weight: 700;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .config-row input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
        }

        .icon-select {
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 0.78rem;
            background: var(--input-bg);
            color: var(--text-main);
        }

        .ics-import-area, .export-area {
            background: var(--sub-card-bg);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ics-controls, .export-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn-today {
            background: var(--primary);
            color: white;
            border: none;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            font-size: 0.72rem;
            padding: 4px 6px;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--widget-radius);
            padding: 18px 14px 22px 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .calendar-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            min-height: 42px;
            padding: 0 2px;
        }

        .header-left-group {
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: color 0.2s;
        }

        .nav-btn:hover { color: var(--text-main); }

        .btn-today-mini {
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.2;
            white-space: nowrap;
        }

        .btn-today-mini:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .month-title-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background-color 0.2s;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            z-index: 1;
        }

        .month-title-wrap:hover {
            background-color: var(--sub-card-bg);
        }

        .month-display {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .month-display::after {
            content: '▾';
            font-size: 0.8rem;
            color: var(--primary);
        }

        .sub-title-display {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 1px;
        }

        .date-picker-modal {
            display: none;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            border-radius: 18px;
            padding: 16px;
            z-index: 100;
            flex-direction: column;
            gap: 12px;
            width: 240px;
        }

        .picker-select-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .picker-select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .picker-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .weekdays div:nth-child(6) { color: var(--sat-color); }
        .weekdays div:last-child { color: var(--sun-color); }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 12px;
        }

        .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 54px;
            position: relative;
            cursor: pointer;
            padding: 2px 0;
            border-radius: 12px;
        }

        .day-cell.other-month {
            opacity: var(--other-month-opacity);
        }

        .day-cell.is-today {
            background-color: var(--today-box);
        }

        .day-number {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .sun .day-number, .day-cell.is-holiday .day-number { color: var(--sun-color); }
        .sat .day-number { color: var(--sat-color); }

        .holiday-dot {
            width: 4px;
            height: 4px;
            background-color: var(--sun-color);
            border-radius: 50%;
            display: inline-block;
        }

        .shift-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            transition: transform 0.2s;
            margin: 0 auto;
        }

        .shift-badge.no-bg {
            background: transparent !important;
            width: 26px;
            height: 26px;
        }

        @media (max-width: 400px) {
            body { padding: 10px 4px; }
            .calendar-card { padding: 14px 8px; }
            .shift-badge { width: 24px; height: 24px; font-size: 0.8rem; }
            .shift-badge.no-bg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-container" id="titleContainer">
            <h1 id="calendarTitleDisplay" ondblclick="enableTitleEdit()" title="더블클릭하여 제목 수정">🗓️ 4조 2교대 근무 달력</h1>
        </div>
    </header>

    <div class="config-card">
        <div class="section-header">
            <span class="section-title">👤 근무자 선택</span>
            <div class="header-btn-group">
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="다크/라이트 모드 전환">☀️</button>
                <button class="toggle-btn" onclick="toggleConfigPanel()">⚙️ 설정</button>
            </div>
        </div>
        
        <div class="worker-list" id="workerList"></div>

        <div class="sub-config-panel" id="subConfigPanel">
            
            <div>
                <div class="config-sub-title" style="margin-bottom: 6px;">✏️ 근무자 이름 수정</div>
                <div class="name-edit-grid">
                    <div class="input-group">
                        <label>근무자 1</label>
                        <input type="text" id="input-team-0" oninput="updateWorkerName(0, this.value)">
                    </div>
                    <div class="input-group">
                        <label>근무자 2</label>
                        <input type="text" id="input-team-1" oninput="updateWorkerName(1, this.value)">
                    </div>
                    <div class="input-group">
                        <label>근무자 3</label>
                        <input type="text" id="input-team-2" oninput="updateWorkerName(2, this.value)">
                    </div>
                    <div class="input-group">
                        <label>근무자 4</label>
                        <input type="text" id="input-team-3" oninput="updateWorkerName(3, this.value)">
                    </div>
                </div>
            </div>

            <div>
                <div class="config-sub-title" style="margin-bottom: 6px;">🎨 근무별 색상 및 아이콘 커스텀</div>
                <div class="shift-custom-grid" id="shiftCustomGrid"></div>
            </div>

            <div>
                <div class="config-sub-title" style="margin-bottom: 6px;">📥 외부 공휴일 ics 불러오기</div>
                <div class="ics-import-area">
                    <div class="ics-controls">
                        <input type="file" id="icsFileInput" accept=".ics" onchange="handleICSFileUpload(this)">
                        <button class="btn btn-danger" onclick="clearImportedHolidays()" id="btnClearIcs" style="display:none;">ics 삭제</button>
                    </div>
                    <div class="ics-status" id="icsStatusText"></div>
                </div>
            </div>

            <div>
                <div class="config-sub-title" style="margin-bottom: 6px;">📅 스케줄 내보내기 (.ics)</div>
                <div class="export-area">
                    <div class="export-controls">
                        <select id="exportMonthCount" class="icon-select" style="padding: 6px;">
                            <option value="1">1개월분</option>
                            <option value="3" selected>3개월분</option>
                            <option value="6">6개월분</option>
                            <option value="12">1년치</option>
                        </select>
                        <button class="btn btn-success" onclick="downloadICSFile()">📥 내보내기</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="legend" id="legendArea"></div>

    <div class="calendar-card">
        <div class="calendar-header">
            <div class="header-left-group">
                <button class="nav-btn" onclick="changeMonth(-1)" title="이전달">⟨</button>
            </div>
            
            <div class="month-title-wrap" onclick="toggleDatePicker()" title="원하는 연도/월로 빠른 이동">
                <div class="month-display" id="monthDisplay">2026년 8월</div>
                <div class="sub-title-display" id="subTitleDisplay">(근무자 A)</div>
            </div>

            <div class="header-right-group">
                <button class="btn-today-mini" onclick="goToday()" title="오늘 날짜로 이동">오늘</button>
                <button class="nav-btn" onclick="changeMonth(1)" title="다음달">⟩</button>
            </div>
        </div>

        <div class="date-picker-modal" id="datePickerModal">
            <div class="picker-select-group">
                <select id="pickerYearSelect" class="picker-select"></select>
                <select id="pickerMonthSelect" class="picker-select"></select>
            </div>
            <div class="picker-btn-group">
                <button class="btn" onclick="toggleDatePicker()">취소</button>
                <button class="btn btn-today" onclick="applyDatePicker()">이동</button>
            </div>
        </div>

        <div class="weekdays">
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
            <div>일</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <script>

// ==========================================
// 💡 [교대근무 패턴 및 팀별 오프셋 설정]
// ==========================================
const DEFAULT_CALENDAR_TITLE = '🗓️ 4조 2교대 근무 달력';

let TEAMS = JSON.parse(localStorage.getItem('shift_teams_v33')) || [
    { id: 0, teamName: '1조', offset: 0, defaultName: '근무자 A' }, // 8/1 주간 1일차
    { id: 1, teamName: '2조', offset: 2, defaultName: '근무자 B' }, // 8/1 야간 1일차
    { id: 2, teamName: '3조', offset: 6, defaultName: '근무자 C' }, // 8/1 두번째 비번 (index 6)
    { id: 3, teamName: '4조', offset: 4, defaultName: '근무자 D' }  // 8/1 휴무 (index 4)
];
// ==========================================

const DEFAULT_KOREA_HOLIDAYS = {

    "2025-03-01": "삼일절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날/부처님오신날",
    "2025-05-06": "대체공휴일", "2025-06-06": "현충일", "2025-08-15": "광복절",
    "2025-10-03": "개천절", "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴",
    "2025-10-08": "대체공휴일", "2025-10-09": "한글날", "2025-12-25": "성탄절",

    "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
    "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
    "2026-05-25": "대체공휴일", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
    "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
    "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절",

    "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴",
    "2027-02-09": "대체공휴일", "2027-03-01": "삼일절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날",
    "2027-06-06": "현충일", "2027-06-07": "대체공휴일", "2027-08-15": "광복절", "2027-08-16": "대체공휴일",
    "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
    "2027-10-03": "개천절", "2027-10-04": "대체공휴일", "2027-10-09": "한글날", "2027-12-25": "성탄절"
};

const ICON_OPTIONS = ['없음', '☀️', '🌤️', '🌞', '🌙', '🌌', '🌃', '☕', '🌴', '🛌', '💤', '🏠', '🔴', '🔵', '🟣', '🟢', '🟡'];

const DEFAULT_SHIFT_CONFIG = {
    '주간': { label: '주간', icon: '', bg: '#eab308', text: '#000000' },
    '야간': { label: '야간', icon: '', bg: '#27272a', text: '#e4e4e7' },
    '휴무': { label: '휴무', icon: '', bg: 'transparent', text: '#ef4444' },
    '비번': { label: '비번', icon: '', bg: 'transparent', text: '#f87171' }
};

const BASE_PATTERN_KEYS = ['주간', '주간', '야간', '야간', '휴무', '비번', '비번', '비번'];

let currentTheme = localStorage.getItem('shift_cal_theme_v30') || 'dark';
let calendarTitle = localStorage.getItem('shift_cal_title_v30') || DEFAULT_CALENDAR_TITLE;
let workerNames = JSON.parse(localStorage.getItem('shift_worker_names_v30')) || TEAMS.map(t => t.defaultName);
let selectedTeamIndex = parseInt(localStorage.getItem('shift_selected_team_v30')) || 0;
let shiftStyles = JSON.parse(localStorage.getItem('shift_styles_v30')) || DEFAULT_SHIFT_CONFIG;
let importedHolidays = JSON.parse(localStorage.getItem('shift_imported_holidays_v30')) || {};

const BASE_DATE = new Date(2026, 7, 1);
let currentDate = new Date();

function init() {
    applyTheme(currentTheme);
    renderTitle();
    renderWorkerButtons();
    initNameInputs();
    renderShiftCustomControls();
    updateICSStatusUI();
    renderLegend();
    renderCalendar();
}

function applyTheme(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('shift_cal_theme_v30', theme);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerText = theme === 'dark' ? '☀️' : '🌙';
    }
}

function toggleTheme() {
    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(nextTheme);
}

function renderTitle() {
    document.getElementById('calendarTitleDisplay').innerText = calendarTitle;
    document.title = calendarTitle;
}

function enableTitleEdit() {
    const container = document.getElementById('titleContainer');
    container.innerHTML = '<input type="text" id="calendarTitleInput" class="title-input" value="' + calendarTitle + '"><button class="btn btn-today" onclick="saveTitle()">저장</button>';
    const input = document.getElementById('calendarTitleInput');
    input.focus();
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') saveTitle();
    });
}

function saveTitle() {
    const input = document.getElementById('calendarTitleInput');
    if (input) {
        const val = input.value.trim();
        calendarTitle = val || DEFAULT_CALENDAR_TITLE;
        localStorage.setItem('shift_cal_title_v30', calendarTitle);
    }
    const container = document.getElementById('titleContainer');
    container.innerHTML = '<h1 id="calendarTitleDisplay" ondblclick="enableTitleEdit()" title="더블클릭하여 제목 수정">' + calendarTitle + '</h1>';
    renderTitle();
}

function renderWorkerButtons() {
    const container = document.getElementById('workerList');
    container.innerHTML = '';

    TEAMS.forEach((team, idx) => {
        const btn = document.createElement('div');
        btn.className = 'worker-btn ' + (selectedTeamIndex === idx ? 'active' : '');
        btn.draggable = true;

        btn.onclick = function() { selectWorker(idx); };

        btn.addEventListener('dragstart', (e) => {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', idx);
        });

        btn.addEventListener('dragend', (e) => {
            e.target.classList.remove('dragging');
        });

        btn.addEventListener('dragover', (e) => e.preventDefault());

        btn.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
            const toIdx = idx;

            if (fromIdx !== toIdx) {
                // 배열 순서 변경
                const movedTeam = TEAMS.splice(fromIdx, 1)[0];
                TEAMS.splice(toIdx, 0, movedTeam);

                // 이름 배열도 함께 순서 변경
                const movedName = workerNames.splice(fromIdx, 1)[0];
                workerNames.splice(toIdx, 0, movedName);

                // 선택된 팀 인덱스 보정
                if (selectedTeamIndex === fromIdx) {
                    selectedTeamIndex = toIdx;
                } else if (selectedTeamIndex > fromIdx && selectedTeamIndex <= toIdx) {
                    selectedTeamIndex--;
                } else if (selectedTeamIndex < fromIdx && selectedTeamIndex >= toIdx) {
                    selectedTeamIndex++;
                }

                // 저장
                localStorage.setItem('shift_teams_v33', JSON.stringify(TEAMS));
                localStorage.setItem('shift_worker_names_v30', JSON.stringify(workerNames));
                localStorage.setItem('shift_selected_team_v30', selectedTeamIndex);

                renderWorkerButtons();
                initNameInputs();
                renderCalendar();
            }
        });

        btn.innerHTML = '<span class="name-text" style="font-size: 0.9rem; font-weight: 700;">' + workerNames[idx] + '</span>';
        container.appendChild(btn);
    });

    const workerNameSpan = document.getElementById('exportWorkerName');
    if (workerNameSpan) workerNameSpan.innerText = workerNames[selectedTeamIndex];
}

function initNameInputs() {
    TEAMS.forEach((_, idx) => {
        const input = document.getElementById('input-team-' + idx);
        if (input) input.value = workerNames[idx];
    });
}

function renderShiftCustomControls() {
    const container = document.getElementById('shiftCustomGrid');
    container.innerHTML = '';

    Object.keys(shiftStyles).forEach(type => {
        const cfg = shiftStyles[type];
        const item = document.createElement('div');
        item.className = 'shift-config-item';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'shift-config-title';
        titleDiv.innerText = type + ' 설정';
        item.appendChild(titleDiv);

        const iconRow = document.createElement('div');
        iconRow.className = 'config-row';
        iconRow.innerHTML = '<span>아이콘</span>';
        const iconSelect = document.createElement('select');
        iconSelect.className = 'icon-select';
        ICON_OPTIONS.forEach(icon => {
            const opt = document.createElement('option');
            opt.value = icon;
            opt.innerText = icon;
            if (cfg.icon === icon || (!cfg.icon && icon === '없음')) opt.selected = true;
            iconSelect.appendChild(opt);
        });
        iconSelect.onchange = function() { updateShiftIcon(type, this.value); };
        iconRow.appendChild(iconSelect);
        item.appendChild(iconRow);

        const bgRow = document.createElement('div');
        bgRow.className = 'config-row';
        bgRow.innerHTML = '<span>배경색</span>';
        
        const bgControls = document.createElement('div');
        bgControls.style.display = 'flex';
        bgControls.style.alignItems = 'center';
        bgControls.style.gap = '6px';

        const bgNoneLabel = document.createElement('label');
        bgNoneLabel.style.fontSize = '0.75rem';
        bgNoneLabel.style.cursor = 'pointer';
        
        const bgNoneCheck = document.createElement('input');
        bgNoneCheck.type = 'checkbox';
        bgNoneCheck.checked = cfg.bg === 'transparent';
        
        bgNoneLabel.appendChild(bgNoneCheck);
        bgNoneLabel.appendChild(document.createTextNode(' 없음'));

        const bgInput = document.createElement('input');
        bgInput.type = 'color';
        bgInput.value = cfg.bg === 'transparent' ? '#334155' : cfg.bg;
        bgInput.disabled = cfg.bg === 'transparent';

        bgNoneCheck.onchange = function() {
            if (this.checked) {
                bgInput.disabled = true;
                updateShiftColor(type, 'bg', 'transparent');
            } else {
                bgInput.disabled = false;
                updateShiftColor(type, 'bg', bgInput.value);
            }
        };

        bgInput.onchange = function() { 
            if (!bgNoneCheck.checked) {
                updateShiftColor(type, 'bg', this.value); 
            }
        };

        bgControls.appendChild(bgNoneLabel);
        bgControls.appendChild(bgInput);
        bgRow.appendChild(bgControls);
        item.appendChild(bgRow);

        const textRow = document.createElement('div');
        textRow.className = 'config-row';
        textRow.innerHTML = '<span>글자색</span>';
        const textInput = document.createElement('input');
        textInput.type = 'color';
        textInput.value = cfg.text.startsWith('#') ? cfg.text : '#ffffff';
        textInput.onchange = function() { updateShiftColor(type, 'text', this.value); };
        textRow.appendChild(textInput);
        item.appendChild(textRow);

        container.appendChild(item);
    });
}

function handleICSFileUpload(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        const parsedHolidays = parseICSContent(content);
        const count = Object.keys(parsedHolidays).length;

        if (count > 0) {
            importedHolidays = parsedHolidays;
            localStorage.setItem('shift_imported_holidays_v30', JSON.stringify(importedHolidays));
            alert('성공적으로 ' + count + '개의 공휴일/기념일 이벤트를 가져와 저장했습니다!');
            updateICSStatusUI();
            renderCalendar();
        } else {
            alert('ics 파일에서 읽을 수 있는 공휴일 이벤트를 찾지 못했습니다.');
        }
    };
    reader.readAsText(file);
}

function parseICSContent(icsText) {
    const holidays = {};
    const events = icsText.split('BEGIN:VEVENT');

    events.forEach(ev => {
        if (!ev.includes('END:VEVENT')) return;

        let summary = '';
        let dtStart = '';

        const lines = ev.split(/\r?\n/);
        lines.forEach(line => {
            if (line.indexOf('SUMMARY:') === 0) {
                summary = line.replace('SUMMARY:', '').trim();
            } else if (line.indexOf('DTSTART') === 0) {
                const parts = line.split(':');
                if (parts.length > 1) {
                    dtStart = parts[1].trim();
                }
            }
        });

        if (summary && dtStart) {
            const dateMatch = dtStart.match(/(\d{4})(\d{2})(\d{2})/);
            if (dateMatch) {
                const formattedKey = dateMatch[1] + '-' + dateMatch[2] + '-' + dateMatch[3];
                holidays[formattedKey] = summary;
            }
        }
    });

    return holidays;
}

function clearImportedHolidays() {
    if (confirm('가져온 ics 공휴일 데이터를 삭제하시겠습니까? (기본 공휴일만 유지됩니다)')) {
        importedHolidays = {};
        localStorage.removeItem('shift_imported_holidays_v30');
        document.getElementById('icsFileInput').value = '';
        updateICSStatusUI();
        renderCalendar();
    }
}

function updateICSStatusUI() {
    const statusText = document.getElementById('icsStatusText');
    const btnClear = document.getElementById('btnClearIcs');
    const count = Object.keys(importedHolidays).length;

    if (count > 0) {
        statusText.innerText = '현재 외부 ics 공휴일 ' + count + '개가 적용 중입니다.';
        btnClear.style.display = 'inline-block';
    } else {
        statusText.innerText = '가져온 외부 ics 파일이 없습니다. (기본 2025~2027 공휴일만 적용됨)';
        btnClear.style.display = 'none';
    }
}

function updateShiftIcon(type, newIcon) {
    shiftStyles[type].icon = (newIcon === '없음' || !newIcon) ? '' : newIcon;
    saveStyles();
}

function updateShiftColor(type, key, hexColor) {
    shiftStyles[type][key] = hexColor;
    saveStyles();
}

function saveStyles() {
    localStorage.setItem('shift_styles_v30', JSON.stringify(shiftStyles));
    renderLegend();
    renderCalendar();
}

function selectWorker(index) {
    selectedTeamIndex = index;
    localStorage.setItem('shift_selected_team_v30', index);
    renderWorkerButtons();
    renderCalendar();
}

function updateWorkerName(index, newName) {
    const trimmed = newName.trim() || TEAMS[index].defaultName;
    workerNames[index] = trimmed;
    localStorage.setItem('shift_worker_names_v30', JSON.stringify(workerNames));
    renderWorkerButtons();
}

function toggleConfigPanel() {
    const panel = document.getElementById('subConfigPanel');
    panel.classList.toggle('show');
}

function renderLegend() {
    const legendArea = document.getElementById('legendArea');
    legendArea.innerHTML = '';

    Object.keys(shiftStyles).forEach(type => {
        const cfg = shiftStyles[type];
        const item = document.createElement('div');
        item.className = 'legend-item';
        
        if (cfg.bg === 'transparent') {
            item.style.backgroundColor = 'transparent';
            item.style.border = '1px dashed var(--border-color)';
        } else {
            item.style.backgroundColor = cfg.bg;
            item.style.border = '1px solid transparent';
        }
        item.style.color = cfg.text;

        const iconStr = (cfg.icon && cfg.icon !== '없음') ? cfg.icon + ' ' : '';
        item.innerText = iconStr + cfg.label;
        legendArea.appendChild(item);
    });
}

function getShiftForDate(targetDate, teamIndex) {
    const timeDiff = targetDate.getTime() - BASE_DATE.getTime();
    const dayDiff = Math.floor(timeDiff / (1000 * 3600 * 24));
    const offset = TEAMS[teamIndex].offset;

    let patternIndex = (dayDiff + offset) % 8;
    if (patternIndex < 0) {
        patternIndex += 8;
    }

    const shiftKey = BASE_PATTERN_KEYS[patternIndex];
    return Object.assign({ key: shiftKey }, shiftStyles[shiftKey]);
}

function formatDateKey(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
}

function toggleDatePicker() {
    const picker = document.getElementById('datePickerModal');
    if (picker.style.display === 'flex') {
        picker.style.display = 'none';
    } else {
        initDatePickerOptions();
        picker.style.display = 'flex';
    }
}

function initDatePickerOptions() {
    const yearSelect = document.getElementById('pickerYearSelect');
    const monthSelect = document.getElementById('pickerMonthSelect');

    const curYear = currentDate.getFullYear();
    const curMonth = currentDate.getMonth() + 1;

    yearSelect.innerHTML = '';
    for (let y = 2020; y <= 2035; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = y + '년';
        if (y === curYear) opt.selected = true;
        yearSelect.appendChild(opt);
    }

    monthSelect.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.innerText = m + '월';
        if (m === curMonth) opt.selected = true;
        monthSelect.appendChild(opt);
    }
}

function applyDatePicker() {
    const yearSelect = document.getElementById('pickerYearSelect');
    const monthSelect = document.getElementById('pickerMonthSelect');

    const targetYear = parseInt(yearSelect.value);
    const targetMonth = parseInt(monthSelect.value) - 1;

    currentDate.setFullYear(targetYear);
    currentDate.setMonth(targetMonth);

    toggleDatePicker();
    renderCalendar();
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const currentWorkerName = workerNames[selectedTeamIndex];
    
    document.getElementById('monthDisplay').innerText = year + '년 ' + (month + 1) + '월';
    document.getElementById('subTitleDisplay').innerText = '(' + currentWorkerName + ')';

    const daysGrid = document.getElementById('daysGrid');
    daysGrid.innerHTML = '';

    const firstDayOfMonth = new Date(year, month, 1);
    const lastDayOfMonth = new Date(year, month + 1, 0);

    let startDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7;
    const totalDays = lastDayOfMonth.getDate();

    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

    const prevMonthLastDay = new Date(year, month, 0).getDate();
    for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const dateObj = new Date(year, month - 1, dayNum);
        createDayCell(dateObj, true);
    }

    for (let day = 1; day <= totalDays; day++) {
        const dateObj = new Date(year, month, day);
        const isToday = isCurrentMonth && day === today.getDate();
        createDayCell(dateObj, false, isToday);
    }

    const renderedCells = startDayOfWeek + totalDays;
    const nextDaysNeeded = (renderedCells > 35 ? 42 : 35) - renderedCells;
    for (let day = 1; day <= nextDaysNeeded; day++) {
        const dateObj = new Date(year, month + 1, day);
        createDayCell(dateObj, true);
    }
}

function createDayCell(dateObj, isOtherMonth, isToday) {
    if (isToday === undefined) isToday = false;
    const daysGrid = document.getElementById('daysGrid');
    const dayCell = document.createElement('div');
    
    const dateKey = formatDateKey(dateObj);
    const holidayTitle = importedHolidays[dateKey] || DEFAULT_KOREA_HOLIDAYS[dateKey];
    const isHoliday = !!holidayTitle;

    dayCell.className = 'day-cell ' + (isOtherMonth ? 'other-month' : '') + ' ' + (isHoliday ? 'is-holiday' : '') + ' ' + (isToday ? 'is-today' : '');

    const dayOfWeek = dateObj.getDay();
    if (dayOfWeek === 0) dayCell.classList.add('sun');
    if (dayOfWeek === 6) dayCell.classList.add('sat');

    const shift = getShiftForDate(dateObj, selectedTeamIndex);

    const isBgTransparent = shift.bg === 'transparent';
    const bgStyle = isBgTransparent ? 'background-color: transparent;' : 'background-color: ' + shift.bg + ';';
    
    const iconDisplay = (shift.icon && shift.icon !== '없음') ? shift.icon : '';
    const labelShort = shift.label ? shift.label.charAt(0) : '';

    const shiftBadgeHtml = '<div class="shift-badge ' + (isBgTransparent ? 'no-bg' : '') + '" style="' + bgStyle + ' color: ' + shift.text + ';">' + iconDisplay + labelShort + '</div>';
    
    const holidayDot = isHoliday ? '<span class="holiday-dot" title="' + holidayTitle + '"></span>' : '';

    dayCell.innerHTML = '<div class="day-number">' + dateObj.getDate() + holidayDot + '</div>' + shiftBadgeHtml;

    daysGrid.appendChild(dayCell);
}

function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
}

function goToday() {
    currentDate = new Date();
    renderCalendar();
}

function downloadICSFile() {
    const monthsToExport = parseInt(document.getElementById('exportMonthCount').value) || 3;
    const currentWorker = workerNames[selectedTeamIndex];

    let lines = [];
    lines.push('BEGIN:VCALENDAR');
    lines.push('VERSION:2.0');
    lines.push('PRODID:-//ShiftCalendar//KR');
    lines.push('CALSCALE:GREGORIAN');
    lines.push('METHOD:PUBLISH');
    lines.push('X-WR-CALNAME:' + calendarTitle + ' (' + currentWorker + ')');

    const startMonthDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);

    for (let m = 0; m < monthsToExport; m++) {
        const iterMonth = new Date(startMonthDate.getFullYear(), startMonthDate.getMonth() + m, 1);
        const daysInMonth = new Date(iterMonth.getFullYear(), iterMonth.getMonth() + 1, 0).getDate();

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(iterMonth.getFullYear(), iterMonth.getMonth(), d);
            const shift = getShiftForDate(dateObj, selectedTeamIndex);

            if (shift.key === '주간' || shift.key === '야간') {
                const dateStr = formatDateICS(dateObj);
                
                let dtStart = '';
                let dtEnd = '';
                if (shift.key === '주간') {
                    dtStart = dateStr + 'T090000';
                    dtEnd = dateStr + 'T180000';
                } else if (shift.key === '야간') {
                    dtStart = dateStr + 'T180000';
                    const nextDay = new Date(dateObj);
                    nextDay.setDate(nextDay.getDate() + 1);
                    const nextDayStr = formatDateICS(nextDay);
                    dtEnd = nextDayStr + 'T090000';
                }

                lines.push('BEGIN:VEVENT');
                const iconStr = (shift.icon && shift.icon !== '없음') ? shift.icon + ' ' : '';
                lines.push('SUMMARY:' + iconStr + shift.key + ' 근무 (' + currentWorker + ')');
                lines.push('DESCRIPTION:' + currentWorker + ' 교대근무 일정');
                lines.push('DTSTART:' + dtStart);
                lines.push('DTEND:' + dtEnd);
                lines.push('END:VEVENT');
            }
        }
    }

    lines.push('END:VCALENDAR');

    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', '교대근무_' + currentWorker + '.ics');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function formatDateICS(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return '' + y + m + d;
}

init();
